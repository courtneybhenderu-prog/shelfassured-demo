<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — ShelfAssured</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.5/dist/umd/supabase.min.js"></script>
    <script>window.SA_DISABLE_GLOBAL_GUARD = true;</script>
    <style>
        body { font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f9fafb; }
        .card { text-align: center; max-width: 320px; padding: 2rem; }
        .spinner { width: 32px; height: 32px; border: 3px solid #e5e7eb; border-top-color: #C62828; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { color: #6b7280; font-size: 0.875rem; margin: 0; }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <p>Redirecting to sign in…</p>
    </div>
    <script src="../config.js?v=20260421"></script>
    <script src="../shared/api.js?v=20260421"></script>
    <script>
    // This page is a compatibility shim for any old bookmarks or hardcoded links.
    // It checks if there's an active session and routes accordingly,
    // otherwise falls back to the shelfer login (the most common entry point).
    (async function() {
        const BASE = location.origin.includes('localhost')
            ? location.origin
            : 'https://app.beshelfassured.com';

        // Wait for Supabase client
        let waited = 0;
        while (!window.saClient && waited < 3000) {
            await new Promise(r => setTimeout(r, 100));
            waited += 100;
        }

        const client = window.saClient;
        if (!client) {
            window.location.href = BASE + '/shelfer/login/';
            return;
        }

        const { data: { session } } = await client.auth.getSession();
        if (!session) {
            // No session — send to shelfer login as default
            window.location.href = BASE + '/shelfer/login/';
            return;
        }

        // Has session — route to correct dashboard
        try {
            const { data: profile } = await client.from('users').select('role').eq('id', session.user.id).single();
            const role = profile?.role || 'shelfer';
            if (role === 'admin') {
                window.location.href = BASE + '/admin/dashboard.html';
            } else if (role === 'brand_client') {
                window.location.href = BASE + '/dashboard/brand-client.html';
            } else {
                window.location.href = BASE + '/dashboard/shelfer.html';
            }
        } catch (e) {
            window.location.href = BASE + '/shelfer/login/';
        }
    })();
    </script>
</body>
</html>

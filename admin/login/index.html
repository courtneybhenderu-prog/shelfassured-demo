<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In — ShelfAssured</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.5/dist/umd/supabase.min.js"></script>
    <script>window.SA_DISABLE_GLOBAL_GUARD = true;</script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; box-sizing: border-box; }
        body { background: #0f0f0f; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 2.5rem 2rem; width: 100%; max-width: 400px; }
        .logo-mark { width: 40px; height: 40px; background: #C62828; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 1.5rem; }
        .logo-mark svg { width: 22px; height: 22px; color: white; }
        h1 { font-size: 1.5rem; font-weight: 700; color: #fff; margin: 0 0 0.25rem; }
        .subtitle { font-size: 0.875rem; color: #6b7280; margin: 0 0 2rem; }
        .role-badge { display: inline-flex; align-items: center; gap: 0.375rem; background: rgba(198,40,40,0.15); color: #f87171; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.25rem 0.625rem; border-radius: 999px; border: 1px solid rgba(198,40,40,0.3); margin-bottom: 1.5rem; }
        .role-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #C62828; }
        label { display: block; font-size: 0.8rem; font-weight: 500; color: #9ca3af; margin-bottom: 0.375rem; }
        input[type="email"], input[type="password"] {
            width: 100%; background: #111; border: 1px solid #2a2a2a; border-radius: 8px;
            color: #fff; font-size: 0.9375rem; padding: 0.75rem 1rem; outline: none; transition: border-color 0.15s;
        }
        input:focus { border-color: #C62828; }
        input::placeholder { color: #4b5563; }
        .form-group { margin-bottom: 1rem; }
        .btn-primary {
            width: 100%; background: #C62828; color: white; font-weight: 600; font-size: 0.9375rem;
            padding: 0.8125rem; border-radius: 8px; border: none; cursor: pointer; transition: background 0.15s; margin-top: 0.5rem;
        }
        .btn-primary:hover { background: #a82020; }
        .btn-primary:disabled { background: #4b1a1a; color: #6b7280; cursor: not-allowed; }
        .divider { display: flex; align-items: center; gap: 0.75rem; margin: 1.25rem 0; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #2a2a2a; }
        .divider span { font-size: 0.75rem; color: #4b5563; }
        .btn-oauth {
            width: 100%; background: #111; border: 1px solid #2a2a2a; border-radius: 8px;
            color: #9ca3af; font-size: 0.875rem; font-weight: 500; padding: 0.75rem;
            display: flex; align-items: center; justify-content: center; gap: 0.625rem;
            cursor: not-allowed; margin-bottom: 0.625rem; position: relative;
        }
        .btn-oauth img { width: 18px; height: 18px; opacity: 0.5; }
        .coming-soon-tag { font-size: 0.65rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; background: #1f2937; color: #6b7280; padding: 0.15rem 0.4rem; border-radius: 4px; margin-left: auto; }
        .forgot-link { font-size: 0.8125rem; color: #6b7280; text-decoration: none; display: block; text-align: right; margin-top: 0.375rem; }
        .forgot-link:hover { color: #9ca3af; }
        .message { font-size: 0.8125rem; padding: 0.625rem 0.875rem; border-radius: 8px; margin-top: 0.75rem; display: none; }
        .message.error { background: rgba(220,38,38,0.1); color: #f87171; border: 1px solid rgba(220,38,38,0.2); display: block; }
        .message.success { background: rgba(16,185,129,0.1); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.2); display: block; }
        .message.info { background: rgba(59,130,246,0.1); color: #93c5fd; border: 1px solid rgba(59,130,246,0.2); display: block; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 0.375rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer-link { text-align: center; margin-top: 1.5rem; font-size: 0.8125rem; color: #4b5563; }
        .footer-link a { color: #9ca3af; text-decoration: none; }
        .footer-link a:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-mark">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        </div>
        <div class="role-badge">Admin Portal</div>
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to the ShelfAssured command center.</p>

        <form id="signin-form" onsubmit="return false;">
            <div class="form-group">
                <label for="email">Email address</label>
                <input id="email" type="email" placeholder="you@beshelfassured.com" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
                <a href="#" class="forgot-link" onclick="handleForgotPassword(); return false;">Forgot password?</a>
            </div>
            <button type="submit" class="btn-primary" id="signin-btn" onclick="handleSignIn()">Sign In</button>
        </form>

        <div id="message" class="message"></div>

        <div class="divider"><span>or continue with</span></div>

        <button class="btn-oauth" title="Coming soon" onclick="showComingSoon()">
            <img src="https://www.google.com/favicon.ico" alt="Google">
            Sign in with Google
            <span class="coming-soon-tag">Soon</span>
        </button>
        <button class="btn-oauth" title="Coming soon" onclick="showComingSoon()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#9ca3af"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
            Sign in with Apple
            <span class="coming-soon-tag">Soon</span>
        </button>

        <div class="footer-link">
            Not an admin? <a href="../../shelfer/login/">Shelfer login</a> · <a href="../../brand/login/">Brand login</a>
        </div>
    </div>

    <script src="../../config.js?v=20260421"></script>
    <script src="../../shared/api.js?v=20260421"></script>
    <script>
    const BASE = location.origin.includes('localhost')
        ? location.origin
        : 'https://beshelfassured.com';

    function showMsg(msg, type) {
        const el = document.getElementById('message');
        el.textContent = msg;
        el.className = 'message ' + type;
    }

    function showComingSoon() {
        showMsg('Google and Apple sign-in are coming soon. Please use email and password for now.', 'info');
    }

    window.handleSignIn = async function() {
        const email    = document.getElementById('email').value.trim().toLowerCase();
        const password = document.getElementById('password').value;
        const btn      = document.getElementById('signin-btn');

        if (!email || !password) { showMsg('Please enter your email and password.', 'error'); return; }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>Signing in…';
        showMsg('Signing in…', 'info');

        try {
            const client = window.saClient;
            if (!client) { showMsg('App not ready — please wait a moment and try again.', 'error'); btn.disabled = false; btn.textContent = 'Sign In'; return; }

            const { data, error } = await client.auth.signInWithPassword({ email, password });
            if (error) { showMsg(error.message, 'error'); btn.disabled = false; btn.textContent = 'Sign In'; return; }

            // Verify role
            const { data: profile } = await client.from('users').select('role').eq('id', data.user.id).single();
            const role = profile?.role;

            if (role !== 'admin') {
                await client.auth.signOut();
                showMsg('Access denied. This portal is for admins only.', 'error');
                btn.disabled = false; btn.textContent = 'Sign In';
                return;
            }

            showMsg('Signed in! Redirecting…', 'success');
            setTimeout(() => { window.location.href = BASE + '/admin/dashboard.html'; }, 700);
        } catch (err) {
            showMsg('Error: ' + err.message, 'error');
            btn.disabled = false; btn.textContent = 'Sign In';
        }
    };

    window.handleForgotPassword = async function() {
        const email = document.getElementById('email').value.trim().toLowerCase();
        if (!email) { showMsg('Enter your email address above first.', 'error'); return; }
        showMsg('Sending reset email…', 'info');
        try {
            const client = window.saClient;
            if (!client) { showMsg('App not ready — try again in a moment.', 'error'); return; }
            const { error } = await client.auth.resetPasswordForEmail(email, {
                redirectTo: BASE + '/auth/confirmed.html'
            });
            if (error) showMsg(error.message, 'error');
            else showMsg('Password reset email sent. Check your inbox.', 'success');
        } catch (err) { showMsg('Error: ' + err.message, 'error'); }
    };

    // Submit on Enter
    document.getElementById('signin-form').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); handleSignIn(); }
    });
    </script>
</body>
</html>

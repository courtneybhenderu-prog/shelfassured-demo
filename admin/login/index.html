<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In — ShelfAssured</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.5/dist/umd/supabase.min.js"></script>
    <script>window.SA_DISABLE_GLOBAL_GUARD = true;</script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --red:    #C62828;
            --red-h:  #B71C1C;
            --gold:   #F9A825;
            --gold-l: #FEF3C7;
            --brown:  #2C2420;
            --gray:   #6B7280;
            --gray-l: #9CA3AF;
            --bg:     #F7F4EF;
            --card:   #FFFFFF;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            -webkit-font-smoothing: antialiased;
        }
        .nav-logo {
            font-size: 1.3rem;
            font-weight: 800;
            text-decoration: none;
            letter-spacing: -0.5px;
            margin-bottom: 2rem;
        }
        .nav-logo .shelf { color: var(--brown); }
        .nav-logo .assured { color: var(--gold); }

        .card {
            background: var(--card);
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 32px rgba(0,0,0,0.07);
        }

        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            background: rgba(198,40,40,0.08);
            color: var(--red);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.3rem 0.75rem;
            border-radius: 999px;
            border: 1px solid rgba(198,40,40,0.2);
            margin-bottom: 1.25rem;
        }
        .role-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--red);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--brown);
            letter-spacing: -0.5px;
            margin-bottom: 0.25rem;
        }
        .subtitle {
            font-size: 0.9rem;
            color: var(--gray);
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--brown);
            margin-bottom: 0.375rem;
        }
        input[type="email"], input[type="password"] {
            width: 100%;
            background: var(--bg);
            border: 1.5px solid rgba(0,0,0,0.1);
            border-radius: 8px;
            color: var(--brown);
            font-size: 0.9375rem;
            font-family: 'Inter', sans-serif;
            padding: 0.75rem 1rem;
            outline: none;
            transition: border-color 0.15s, background 0.15s;
        }
        input:focus { border-color: var(--red); background: #fff; }
        input::placeholder { color: var(--gray-l); }
        .form-group { margin-bottom: 1rem; }

        .btn-primary {
            width: 100%;
            background: var(--red);
            color: white;
            font-weight: 700;
            font-size: 0.9375rem;
            font-family: 'Inter', sans-serif;
            padding: 0.875rem;
            border-radius: 9999px;
            border: none;
            cursor: pointer;
            transition: background 0.15s;
            margin-top: 0.5rem;
        }
        .btn-primary:hover { background: var(--red-h); }
        .btn-primary:disabled { background: #e5e7eb; color: var(--gray-l); cursor: not-allowed; }

        .divider {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 1.5rem 0;
        }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(0,0,0,0.08); }
        .divider span { font-size: 0.75rem; color: var(--gray-l); white-space: nowrap; }

        .btn-oauth {
            width: 100%;
            background: var(--bg);
            border: 1.5px solid rgba(0,0,0,0.1);
            border-radius: 9999px;
            color: var(--gray);
            font-size: 0.875rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.625rem;
            cursor: not-allowed;
            margin-bottom: 0.625rem;
        }
        .btn-oauth img { width: 18px; height: 18px; opacity: 0.5; }
        .btn-oauth svg { opacity: 0.4; }
        .coming-soon-tag {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            background: var(--gold-l);
            color: #92400E;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            margin-left: auto;
        }

        .forgot-link {
            font-size: 0.8125rem;
            color: var(--gray);
            text-decoration: none;
            display: block;
            text-align: right;
            margin-top: 0.375rem;
        }
        .forgot-link:hover { color: var(--brown); }

        .message {
            font-size: 0.8125rem;
            padding: 0.625rem 0.875rem;
            border-radius: 8px;
            margin-top: 0.75rem;
            display: none;
            line-height: 1.5;
        }
        .message.error   { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; display: block; }
        .message.success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; display: block; }
        .message.info    { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; display: block; }

        .spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 0.375rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .footer-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.8125rem;
            color: var(--gray-l);
        }
        .footer-link a { color: var(--gray); text-decoration: none; }
        .footer-link a:hover { color: var(--brown); text-decoration: underline; }
    </style>
</head>
<body>
    <a href="https://beshelfassured.com" class="nav-logo">
        <span class="shelf">Shelf</span><span class="assured">Assured</span>
    </a>

    <div class="card">
        <div class="role-badge">Admin Portal</div>
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to the ShelfAssured command center.</p>

        <form id="signin-form" onsubmit="return false;">
            <div class="form-group">
                <label for="email">Email address</label>
                <input id="email" type="email" placeholder="you@beshelfassured.com" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
                <a href="#" class="forgot-link" onclick="handleForgotPassword(); return false;">Forgot password?</a>
            </div>
            <button type="submit" class="btn-primary" id="signin-btn" onclick="handleSignIn()">Sign In</button>
        </form>

        <div id="message" class="message"></div>

        <div class="divider"><span>or continue with</span></div>

        <button class="btn-oauth" title="Coming soon" onclick="showComingSoon()">
            <img src="https://www.google.com/favicon.ico" alt="Google">
            Sign in with Google
            <span class="coming-soon-tag">Soon</span>
        </button>
        <button class="btn-oauth" title="Coming soon" onclick="showComingSoon()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#6B7280"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
            Sign in with Apple
            <span class="coming-soon-tag">Soon</span>
        </button>

        <div class="footer-link">
            Not an admin? <a href="../../shelfer/login/">Shelfer login</a> · <a href="../../brand/login/">Brand login</a>
        </div>
    </div>

    <script src="../../config.js?v=20260421"></script>
    <script src="../../shared/api.js?v=20260421"></script>
    <script>
    const BASE = 'https://app.beshelfassured.com';

    function showMsg(msg, type) {
        const el = document.getElementById('message');
        el.textContent = msg;
        el.className = 'message ' + type;
    }

    function showComingSoon() {
        showMsg('Google and Apple sign-in are coming soon. Please use email and password for now.', 'info');
    }

    window.handleSignIn = async function() {
        const email    = document.getElementById('email').value.trim().toLowerCase();
        const password = document.getElementById('password').value;
        const btn      = document.getElementById('signin-btn');

        if (!email || !password) { showMsg('Please enter your email and password.', 'error'); return; }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>Signing in…';
        showMsg('Signing in…', 'info');

        try {
            const client = window.saClient;
            if (!client) { showMsg('App not ready — please wait a moment and try again.', 'error'); btn.disabled = false; btn.textContent = 'Sign In'; return; }

            const { data, error } = await client.auth.signInWithPassword({ email, password });
            if (error) { showMsg(error.message, 'error'); btn.disabled = false; btn.textContent = 'Sign In'; return; }

            // Verify role
            const { data: profile } = await client.from('users').select('role').eq('id', data.user.id).single();
            const role = profile?.role;

            if (role !== 'admin') {
                await client.auth.signOut();
                showMsg('Access denied. This portal is for admins only.', 'error');
                btn.disabled = false; btn.textContent = 'Sign In';
                return;
            }

            showMsg('Signed in! Redirecting…', 'success');
            setTimeout(() => { window.location.href = BASE + '/admin/dashboard.html'; }, 700);
        } catch (err) {
            showMsg('Error: ' + err.message, 'error');
            btn.disabled = false; btn.textContent = 'Sign In';
        }
    };

    window.handleForgotPassword = async function() {
        const email = document.getElementById('email').value.trim().toLowerCase();
        if (!email) { showMsg('Enter your email address above first.', 'error'); return; }
        showMsg('Sending reset email…', 'info');
        try {
            const client = window.saClient;
            if (!client) { showMsg('App not ready — try again in a moment.', 'error'); return; }
            const { error } = await client.auth.resetPasswordForEmail(email, {
                redirectTo: BASE + '/auth/confirmed.html'
            });
            if (error) showMsg(error.message, 'error');
            else showMsg('Password reset email sent. Check your inbox.', 'success');
        } catch (err) { showMsg('Error: ' + err.message, 'error'); }
    };

    document.getElementById('signin-form').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); handleSignIn(); }
    });
    </script>
</body>
</html>
